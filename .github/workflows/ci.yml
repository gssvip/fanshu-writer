name: CI

# ============================================================================
# 唯一事实源：source/frontend/src + source/backend
# 前端产物（dist）由本 CI 构建一次，自动同步到全部发布位置：
#   1. source/backend/static  → Render 后端托管的前端（后端 serve_frontend 优先级最高）
#   2. source/frontend/dist   → 本地开发 / Render FANSHU_FRONTEND_DIST 环境变量指向
#   3. 仓库根目录             → app.py 根目录兜底 fallback
#   4. gh-pages 分支          → GitHub Pages（legacy 分支部署模式）
# 禁止手动构建/手动同步产物（旧 deploy.sh 已废弃，仅留作应急）。
# ============================================================================

on:
  pull_request:
    paths:
      - "source/backend/**"
      - "source/frontend/src/**"
      - "source/frontend/package.json"
      - "source/frontend/package-lock.json"
      - "source/scripts/check-architecture.py"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    # push 到 main 全路径跑：确保任何修改都能触发统一发布管线（目录同步 + gh-pages + Render）
    # PR 阶段保留 path filter 降噪

permissions:
  contents: write  # deploy job 需回写构建产物到 main 并推送 gh-pages

jobs:
  architecture-gate:
    name: 架构门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 运行架构门禁（防巨石回生）
        # 脚本内部以 __file__ 定位 ROOT，故从仓库根目录调用 source/scripts/...
        run: python source/scripts/check-architecture.py

  backend-test:
    name: 后端冒烟测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/backend
    env:
      # 测试环境：强制 SQLite，不触发生产检测
      FANSHU_DATA_DIR: /tmp/fanshu_test_data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            source/backend/requirements.txt
            source/backend/requirements-dev.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: 语法编译检查
        run: python -m py_compile app.py && echo "syntax OK"

      - name: 运行 pytest
        run: python -m pytest tests/ -v

  # 统一发布：测试全绿后 → 构建前端一次 → 同步所有产物位置 → 触发 Render
  deploy:
    name: 统一构建发布（static/root/gh-pages/Render）
    needs: [architecture-gate, backend-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: 拉取 main 最新代码
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: source/frontend/package-lock.json

      - name: 构建前端
        working-directory: source/frontend
        run: |
          npm ci
          npm run build

      - name: 生成 version.json 与缓存戳
        working-directory: source/frontend
        run: |
          TS=$(date +%s)
          SHA="${{ github.sha }}"
          JS_FILE=$(grep -oE 'assets/index-[^"]+\.js' dist/index.html | head -1)
          printf '{"v":"%s","t":%s,"js":"%s"}' "$SHA" "$TS" "$JS_FILE" > dist/version.json
          echo "version.json: $(cat dist/version.json)"
          # 给 JS/CSS 引用加版本戳，防中间缓存（与旧 deploy.sh 行为一致）
          sed -i "s|src=\"\(\./assets/index-[^\"]*\.js\)\"|src=\"\1?v=$TS\"|g" dist/index.html
          sed -i "s|href=\"\(\./assets/index-[^\"]*\.css\)\"|href=\"\1?v=$TS\"|g" dist/index.html

      - name: 同步产物 → source/backend/static（Render 托管源）
        run: |
          rm -rf source/backend/static
          mkdir -p source/backend/static
          cp -r source/frontend/dist/. source/backend/static/
          echo "backend/static 已同步："
          ls source/backend/static/assets/

      - name: 同步产物 → 仓库根目录（app.py 兜底 fallback）
        run: |
          cp -f source/frontend/dist/index.html .
          cp -f source/frontend/dist/version.json .
          rm -rf assets && mkdir -p assets
          cp -rf source/frontend/dist/assets/. assets/

      - name: 提交产物回 main（含 source/frontend/dist）
        run: |
          git config user.name "fanshu-ci"
          git config user.email "ci@fanshu.dev"
          git add source/backend/static source/frontend/dist index.html version.json assets
          if git diff --cached --quiet; then
            echo "产物无变化，跳过提交"
          else
            git commit -m "deploy: 构建产物自动同步 ${{ github.sha }} [skip ci]"
            git push
            echo "已提交产物到 main"
          fi

      - name: 发布 gh-pages（GitHub Pages）
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./source/frontend/dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "deploy: auto ${{ github.sha }}"

      - name: 触发 Render 部署
        # 若 Render 服务已开启 Auto-Deploy on push（默认开启），上一步产物提交已触发部署，
        # 此 Hook 作为兜底双保险；secret 未配置时静默跳过。
        # Hook 失败不阻断 CI：Render hook 在服务部署中会 500，Auto-Deploy 已兜底，
        # 此处重试 1 次后降级为警告（历史事故：hook 500 导致 CI 连红误判为代码问题）。
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "⚠️  未配置 RENDER_DEPLOY_HOOK_URL secret（Render Auto-Deploy 开启时无需配置）"
            exit 0
          fi
          echo "🚀 触发 Render 部署..."
          STATUS_CODE=$(curl -s -o /tmp/render_resp.json -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
          if [ "$STATUS_CODE" != "200" ] && [ "$STATUS_CODE" != "202" ]; then
            echo "Hook 返回 $STATUS_CODE，10s 后重试一次..."
            sleep 10
            STATUS_CODE=$(curl -s -o /tmp/render_resp.json -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
          fi
          echo "Render 响应状态码: $STATUS_CODE"
          cat /tmp/render_resp.json
          if [ "$STATUS_CODE" = "200" ] || [ "$STATUS_CODE" = "202" ]; then
            echo "✅ Render 部署已触发"
          else
            echo "⚠️  Render 部署触发失败（HTTP $STATUS_CODE）——不阻断 CI，Auto-Deploy 会兜底部署"
          fi
