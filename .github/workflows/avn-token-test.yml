name: AVN Token Test

# 一次性验证工作流：确认 Secrets.AVN_API_TOKEN 已配置且能调用 Aiven API。
# 验证完成后本文件删除，不保留。
on:
  push:
    branches: [main]
    paths: ['.github/workflows/avn-token-test.yml']

jobs:
  test-token:
    runs-on: ubuntu-latest
    steps:
      - name: 验证 AVN_API_TOKEN Secret
        run: |
          if [ -z "${{ secrets.AVN_API_TOKEN }}" ]; then
            echo "RESULT: SECRET_MISSING — AVN_API_TOKEN 未配置"
            exit 1
          fi
          echo "RESULT: SECRET_PRESENT — Secret 已配置"
          code=$(curl -s -o /tmp/avn.json -w "%{http_code}" \
            "https://api.aiven.io/v1/project/fanshu/service/pg-fanshu" \
            -H "Authorization: Bearer ${{ secrets.AVN_API_TOKEN }}")
          echo "Aiven API HTTP: $code"
          state=$(jq -r '.service.state // "unknown"' /tmp/avn.json 2>/dev/null || echo unknown)
          if [ "$code" = "200" ]; then
            echo "RESULT: TOKEN_VALID — token 有效，数据库状态: $state"
          else
            echo "RESULT: TOKEN_INVALID — HTTP $code"
            exit 1
          fi
