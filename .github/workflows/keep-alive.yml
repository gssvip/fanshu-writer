name: Keep-Alive

# ============================================================================
# 保活策略（2026-11-08 更新：数据库已迁 Aiven）
#
# 1. Render 免费版 Web Service 15 分钟无流量自动休眠 → 每 5 分钟探活一次保持常温。
# 2. Aiven 免费版 PostgreSQL 无持续活动会自动关机（Powered off，域名停止解析，
#    部署连库报 "failed to resolve host"）。Aiven 检测的是数据库活动而非网站流量，
#    因此探活改为 /api/health?db=1，每次真实执行 SELECT 1 保持数据库活动。
#    查库后连接立即归还连接池（health_bp 用 engine.connect() 上下文管理器），
#    Aiven 免费版 20 连接上限不会被占用。Aiven 无计算配额限制，可放心保活。
#    旧铁律"严禁 ?db=1"仅针对 Neon 计算配额，已不适用。
#    频率 5 分钟一次（2026-11-08 用户要求：保 Render 常温 + 保 Aiven 活动）。
# 3. 兜底：若数据库仍被关机（db != ok），尝试通过 Aiven API 自动开机。
#    （应用内另有同款兜底 db_autostart.py：业务请求失败即触发，响应比本工作流更快）
#    需在仓库 Secrets 配置 AVN_API_TOKEN（Aiven 控制台 → Profile → Authentication
#    tokens 生成，权限含 services:write）；可选 AVN_PROJECT（默认 fanshu）、
#    AVN_SERVICE（默认 pg-fanshu）。未配置 token 时跳过兜底，仅告警。
# ============================================================================

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    name: 探活后端并保持数据库活动
    runs-on: ubuntu-latest
    steps:
      - name: GET /api/health?db=1（保活 Aiven）
        run: |
          resp=$(curl -s --max-time 120 "https://fanshu-writer-backend.onrender.com/api/health?db=1" || echo '{}')
          echo "health response: $resp"
          db=$(echo "$resp" | jq -r '.db // "unknown"')
          if [ "$db" = "ok" ]; then
            echo "backend warm, database active"
          else
            echo "database NOT ok (status=$db), backend may be deploying or DB powered off"
            echo "DB_DOWN=true" >> "$GITHUB_ENV"
          fi

      - name: 兜底自动开机（Aiven API）
        if: env.DB_DOWN == 'true'
        run: |
          if [ -z "${{ secrets.AVN_API_TOKEN }}" ]; then
            echo "AVN_API_TOKEN 未配置，跳过自动开机（请到 Aiven 控制台手动 Power on）"
            exit 0
          fi
          project="${{ secrets.AVN_PROJECT || 'fanshu' }}"
          service="${{ secrets.AVN_SERVICE || 'pg-fanshu' }}"
          echo "trying power-on: project=$project service=$service"
          code=$(curl -s -o /tmp/avn_resp.json -w "%{http_code}" -X PUT \
            "https://api.aiven.io/v1/project/${project}/service/${service}" \
            -H "Authorization: Bearer ${{ secrets.AVN_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"powered": true}')
          echo "Aiven API status: $code"
          cat /tmp/avn_resp.json
          echo ""
          # 字段名 powered 已实测（2026-11-08）：200=开机指令已接受/运行中（幂等），
          # 400=参数或权限错误。200 视为成功；其他不让工作流失败（人工介入即可）
