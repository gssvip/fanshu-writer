<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EdgeOne 最小验证版</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 20px; }
  .card { border: 1px solid #e0e0e0; border-radius: 8px; padding: 16px; margin: 12px 0; }
  button { padding: 8px 16px; font-size: 14px; cursor: pointer; border-radius: 6px; border: 1px solid #ccc; background: #f5f5f5; }
  button:active { background: #e0e0e0; }
  pre { background: #f5f5f5; padding: 12px; border-radius: 6px; white-space: pre-wrap; word-break: break-all; max-height: 300px; overflow-y: auto; font-size: 13px; }
  .stream-output { font-size: 18px; min-height: 40px; color: #333; }
  .label { font-size: 12px; color: #888; margin-bottom: 8px; }
</style>
</head>
<body>
  <h1>EdgeOne Cloud Functions 最小验证版</h1>

  <div class="card">
    <div class="label">1. 健康检查（验证 Flask 能否启动）</div>
    <button onclick="testHealth()">测试 /api/health</button>
    <pre id="health-output">点击按钮测试</pre>
  </div>

  <div class="card">
    <div class="label">2. SSE 流式测试（验证流式响应是否支持）</div>
    <button onclick="testStream()">测试 /api/test-stream</button>
    <div class="stream-output" id="stream-output"></div>
    <pre id="stream-raw" style="font-size:11px;color:#888;"></pre>
  </div>

  <div class="card">
    <div class="label">3. 长耗时测试（验证 maxDuration 是否够用）</div>
    <button onclick="testSlow(30)">sleep 30s</button>
    <button onclick="testSlow(60)">sleep 60s</button>
    <pre id="slow-output">点击按钮测试</pre>
  </div>

  <div class="card">
    <div class="label">4. 文件系统写入测试（验证 /tmp 可写，boot gate 需要）</div>
    <button onclick="testFs()">测试 /api/test-fs</button>
    <pre id="fs-output">点击按钮测试</pre>
  </div>

<script>
async function testHealth() {
  const out = document.getElementById('health-output');
  out.textContent = '请求中...';
  try {
    const r = await fetch('/api/health');
    const data = await r.json();
    out.textContent = JSON.stringify(data, null, 2);
  } catch (e) {
    out.textContent = '错误: ' + e.message;
  }
}

function testStream() {
  const out = document.getElementById('stream-output');
  const raw = document.getElementById('stream-raw');
  out.textContent = '';
  raw.textContent = '连接中...';

  const es = new EventSource('/api/test-stream');
  es.onmessage = (e) => {
    raw.textContent = '收到: ' + e.data;
    if (e.data === '[DONE]') {
      raw.textContent = '✅ 流式完成';
      es.close();
      return;
    }
    try {
      const obj = JSON.parse(e.data);
      out.textContent += obj.char;
    } catch {}
  };
  es.onerror = (e) => {
    raw.textContent = '❌ SSE 错误: 连接被关闭（可能不支持流式）';
    es.close();
  };
}

async function testSlow(seconds) {
  const out = document.getElementById('slow-output');
  out.textContent = `sleep ${seconds}s 中...（如果超时说明 maxDuration 不够）`;
  const start = Date.now();
  try {
    const r = await fetch(`/api/test-slow?seconds=${seconds}`);
    const data = await r.json();
    const elapsed = ((Date.now() - start) / 1000).toFixed(1);
    out.textContent = `✅ 成功！耗时 ${elapsed}s\n` + JSON.stringify(data, null, 2);
  } catch (e) {
    const elapsed = ((Date.now() - start) / 1000).toFixed(1);
    out.textContent = `❌ 失败（${elapsed}s）: ` + e.message + '\n可能是 maxDuration 超时或网络断开';
  }
}

async function testFs() {
  const out = document.getElementById('fs-output');
  out.textContent = '请求中...';
  try {
    const r = await fetch('/api/test-fs');
    const data = await r.json();
    out.textContent = JSON.stringify(data, null, 2);
  } catch (e) {
    out.textContent = '错误: ' + e.message;
  }
}
</script>
</body>
</html>
