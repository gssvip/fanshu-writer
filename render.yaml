services:
  - type: web
    name: fanshu-writer-backend
    runtime: python
    rootDir: source/backend
    plan: free
    # 前端构建产物已提交到 backend/static（git 跟踪），无需在 Render 上重新 build
    # 简化构建命令，避免免费版内存不足导致 npm build 失败
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      # ============================================================
      # 铁律：用户数据（账号及作品）必须存到 PostgreSQL，绝不能因部署丢失
      # ============================================================
      # 生产环境未配置 DATABASE_URL 时，应用会拒绝启动（铁律保护）
      # 请确保 DATABASE_URL 已在 Environment 中配置，否则部署会失败
      #
      # 推荐 Neon 免费版（永久免费 0.5GB，数据持久）：https://neon.tech
      # 注册后在 Render 的 Environment 里手动添加：
      #   key=DATABASE_URL
      #   value=postgresql://user:password@host/dbname?sslmode=require
      # ============================================================
      - key: FANSHU_DATA_DIR
        value: /tmp/fanshu-data
      # ⚠️ 关键修复：不要设 FANSHU_FRONTEND_DIST=../frontend/dist（该目录在 Render
      # rootDir=source/backend 下可能不存在/不是最新构建，且前端构建产物统一由
      # CI 预构建到 backend/static，app.py 优先级 #2 会自动使用 backend/static，
      # 避免后端读到旧 dist 导致"前端没更新"假象。
