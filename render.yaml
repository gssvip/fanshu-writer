services:
  - type: web
    name: app-backend
    runtime: python
    rootDir: source/backend
    plan: free
    # 生产前端静态文件路径：<repo>/source/backend/static/（git 跟踪，预构建产物）
    # 任何部署只用跑：bash deploy.sh 一键完成 构建→对账→commit→push→部署
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      # 铁律：用户数据存 PostgreSQL；未配置 DATABASE_URL 时应用会拒绝启动
      # 推荐使用 Neon / Supabase Postgres，然后在 Render Environment 手动添加：
      #   DATABASE_URL=postgresql://user:password@host/dbname?sslmode=require
      - key: APP_DATA_DIR
        value: /tmp/app-data
      # APP_FRONTEND_DIST 不建议设，默认读取 backend/static（预构建）
      - key: APP_SECRET_KEY
        generateValue: true
