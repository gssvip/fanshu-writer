services:
  - type: web
    name: fanshu-writer-backend
    runtime: python
    rootDir: source/backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      # 数据库：配置 DATABASE_URL 后用户数据存到外部 PostgreSQL，部署不丢失
      # 推荐用 Neon 免费版（永久免费 1GB）：https://neon.tech
      # 注册后在 Render 的 Environment 里手动添加 key=DATABASE_URL，value=Neon 连接字符串
      # 格式：postgresql://user:password@host/dbname?sslmode=require
      # 未配置时回退到 SQLite（部署会丢失用户数据！）
      - key: FANSHU_DATA_DIR
        value: /tmp/fanshu-data
      - key: FANSHU_FRONTEND_DIST
        value: ../frontend/dist
