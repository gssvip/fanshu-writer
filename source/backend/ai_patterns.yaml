# AI 痕迹模式词库（确定性后写校验用）
# 来源：参考 Openwrite craft/ai_patterns.yaml + 网文创作经验整理
# 严重性等级：critical（必须改）/ warning（建议改）

# ===== 禁止句式（critical）=====
forbidden_patterns:
  # ===== 禁令0·修正式否定句·5类识别口径（critical，命中即必改）=====
  # ① 对立式否定（不是A而是B/不是X，是Y/不是A，却B）
  - pattern: '不是.{0,25}?而[是为却又且]'
    reason: '禁令0·对立式否定（"不是…而是/就是…"）是典型 AI 修正式公式，改为直接陈述句'
  - pattern: '不是.{0,15}?，?是'
    reason: '禁令0·对立式否定（"不是X，是Y"），改为直接陈述'
  # ② 排比三连修正式（不是…不是…而是…）
  - pattern: '不是.{0,20}?不是.{0,20}?而[是为]'
    reason: '禁令0·排比三连修正式（"不是…不是…而是…"），全章禁绝，改直接动作句'
  # ③ 自我修正式（或者说/甚至可以说/准确地讲/更准确地说/与其说…不如说）
  - pattern: '(或者说|甚至可以说|更?准确地?讲|更?准确地说)'
    reason: '禁令0·自我修正式（"或者说/更准确地说…"）是 AI 典型咬文嚼字腔，删掉重写'
  - pattern: '与其说.{0,20}?不如说'
    reason: '禁令0·自我修正式（"与其说…不如说…"），改为直接描写或动作'
  # ④ 否定式修辞（不是比喻/不是夸张/不是X那种，是Y —— 先否定再肯定）
  - pattern: '不是(比喻|夸张|形容|修辞|地震那种|空穴来风)'
    reason: '禁令0·否定式修辞（"不是比喻/不是夸张/不是X那种"），改为直接描写或比喻本体'
  # ⑤ 否定词前置修饰腔（不夸张地说/不客气地讲/不夸张地形容/不瞒你说）
  - pattern: '(不夸张地说|不客气地讲|不夸张地形容|不说假话|不瞒你说)'
    reason: '禁令0·否定前置修饰腔（"不夸张地说/不客气地讲…"）是 AI 旁白腔，删掉'
  # 其它通用修正式否定
  - pattern: '并非.{0,20}?而是'
    reason: '禁令0·"并非…而是…"公式化转折，重新组织表达'
  # 破折号滥用
  - pattern: '——'
    reason: '破折号“——”是 AI 高频标点，改为逗号或句号'
  # 元叙事
  - pattern: '到这里算是'
    reason: '元叙事表达，作者不该跳出故事说话'
  - pattern: '读者可能'
    reason: '元叙事，不要提及读者'
  - pattern: '作者想说'
    reason: '元叙事，不要以作者身份说话'
  - pattern: '接下来将'
    reason: '预告式元叙事，让事件自然发生'
  - pattern: '故事到此'
    reason: '元叙事总结，删除'
  # 报告术语
  - pattern: '核心动机'
    reason: '分析报告术语，不应出现在正文'
  - pattern: '信息边界'
    reason: '分析报告术语，不应出现在正文'
  - pattern: '叙事支撑'
    reason: '分析报告术语，不应出现在正文'
  - pattern: '弧线转折'
    reason: '分析报告术语，不应出现在正文'
  - pattern: '角色弧光'
    reason: '分析报告术语，不应出现在正文'
  # 说教词
  - pattern: '毋庸置疑'
    reason: '说教词，用事实说话'
  - pattern: '不言而喻'
    reason: '说教词，用事实说话'
  - pattern: '显而易见'
    reason: '说教词，用事实说话'
  # ===== 冰山人物·贴标签情绪词（critical：结论式情绪直接写，命中即改反常行为+小动作+体感+微表情）=====
  - pattern: '(他|她|它|自己|他们|她们|众人|大家|全场|所有人)(感到|感觉|十分|非常|无比|特别|极为|甚是|颇|一脸|满心|内心|心里|心中|心头|情绪|一阵)(震惊|震惊|复杂|激动|愤怒|悲伤|喜悦|紧张|恐惧|害怕|疑惑|怀疑|诧异|惊讶|兴奋|高兴|难过|痛苦|焦虑|担忧|不安|欣喜|失落|绝望|骄傲|傲慢|羞涩|害羞|感动|感激|愧疚|懊悔)'
    reason: '冰山人物铁律：严禁"他/她感到 + 情绪名词"的贴标签写法，必须改为"反常行为 + 小动作 + 体感 + 微表情"四要素描写'
  - pattern: '^[ \t]*(十分|非常|无比|特别|极为|甚是|颇|一脸|满心|内心|心里|心中|心头)(震惊|复杂|激动|愤怒|悲伤|喜悦|紧张|恐惧|害怕|疑惑|诧异|惊讶|兴奋|高兴|难过|痛苦|焦虑|担忧|不安|欣喜|失落|绝望|骄傲|傲慢|羞涩|害羞|感动|感激|愧疚|懊悔)'
    reason: '冰山人物铁律：段首直接堆结论式情绪词是典型 AI 贴标签写法，必须改反常行为+小动作描写'
  # ===== AI 必删词 30+ 核心词（critical 级 regex 兜底，命中即算必删词漏网）=====
  - pattern: '(深吸一口气|眼中闪过一丝|心中暗想|心念电转|若有所思|不知不觉间|与此同时|嘴角微微上扬|那道身影|话音未落|说话间)'
    reason: 'AI 必删词 30+：典型 AI 叙述套话（深吸一口气/眼中闪过一丝/心中暗想/与此同时 等），直接删除或改写为具体动作描写/对话直接引语'
  # ===== Humanizer·删废话黑名单 16+7 词（critical 级，命中即删）=====
  - pattern: '(值得注意的是|总的来说|与此同时|不可否认|毫无疑问|显而易见|众所周知|由此可见|值得一提的是|综上所述|换言之|从某种意义上说|需要指出的是|不言而喻|毋庸置疑|也就是说|换句话说|不难看出|可以说|可以这么说|需要说明的是)'
    reason: 'Humanizer 5.1·删废话黑名单：典型 AI 书面化过渡/强调拐杖词，直接删除或让前后句自然衔接'
  # ===== Humanizer 5.2·禁止句式 6 种（critical 级 regex 覆盖）=====
  # ① 虽然…但是… 转折对仗句式（改用内心吐槽/动作反差）
  - pattern: '虽然[^。！？]{4,60}但是'
    reason: 'Humanizer 5.2·禁止「虽然……但是……」公式化转折：改用角色内心吐槽/前后动作反差写转折，不要用连接词硬套'
  # ② 不仅…而且… 递进句式（打散为两句）
  - pattern: '不仅[^。！？]{4,60}(而且|并且|还同时|更进一步)'
    reason: 'Humanizer 5.2·禁止「不仅……而且……」递进对仗：拆成两句，各写一个事实'
  # ③ 第一/首先…第二/其次…第三… 三段式列举腔
  - pattern: '(?:第一|首先)[^。！？]{2,30}(?:第二|其次)[^。！？]{2,30}(?:第三|最后)'
    reason: 'Humanizer 5.2·禁止「第一/首先…第二/其次…第三…」三段式列举腔：改为散句叙述，两项/四项比三项自然'
  # ④ 连续「了」字堆砌（同一句 ≥ 3 个「了」→ 保留 1 个有力的，其余删掉或改动词）
  - pattern: '[^。！？\n]{4,}(了[^。！？\n]{0,10}){3,}'
    reason: 'Humanizer 5.2·禁止连续「了」字堆砌：同一句只保留 1 个有力的"了"，其余删掉或换"动作动词原形"（走了过去→走过去；拿了杯子→端起杯子）'
  # ===== Humanizer 5.3·被字句 ≥ 阈值告警（critical，整章>1就提示；warning 级 regex 先兜底）=====
  - pattern: '(?:被(?:他|她|它|他们|她们|人们|群众|风|雨|车|人)?(?:给|把|叫|让)?[^。！？\n]{2,30}(?:捏|抓|打|杀|抓|吓|传|推|吹|开|关|放|抓|咬|刺|劈|砸|扔|丢))'
    reason: 'Humanizer 5.3·被字句优先改主动："被"字句翻成主动（杯子被他捏碎了→他捏碎了杯子），整章被字句≤1处，用主动语态天然网文味'
  # ===== Humanizer 5.5·分析报告术语（正文绝不能出现）=====
  - pattern: '(核心动机|信息边界|信息落差|利益最大化|底层逻辑|认知差|降维打击)'
    reason: 'Humanizer 5.5·分析报告术语：正文是写故事，不是商业分析报告；这类词出现在正文就像AI把PPT写进了小说'
  # ===== Humanizer 5.4·X地 副词 模式级告警（高频冷地/悄地/快地/慢地/死地命中即报）=====
  - pattern: '(冷冷地|悄悄地|快速地|慢慢地|缓缓地|死死地|轻轻地|狠狠地|微微地|默默地|静静地|重重地|深深地|紧紧地)'
    reason: 'Humanizer 5.4·「X地」副词一律删或改动作/声音/触感：冷冷地说→动作+微表情；悄悄地走→声音+动作描写；不要写"XX地XX"的副词模板'
  # ===== Humanizer 元叙事/作者旁白（AI 跳出来说话模式）=====
  - pattern: '(到这里算是|话说回来|这一幕恰好说明|这个伏笔后面会用到|写到这里|我们可以看到|不难发现)'
    reason: 'Humanizer 叙事恶习·禁止元叙事旁白：作者绝不跳出故事直接跟读者说话；"到这里算是钉死了/话说回来"这类编剧腔直接删除'

