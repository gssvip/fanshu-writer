# ===== 网文疲劳词密度阈值 =====
# 单词每章出现次数上限
fatigue_word_max_per_chapter: 2
# 转折类词每 3000 字上限
transition_word_max_per_3000: 1

# ===== 段落结构检查 =====
# （阈值校准依据：三份真人写作样本·3601段 金标准统计，详见脚本分析输出）
# 金标准 P99=69字，最长110字（仅0.1%），故 70/100 作为轻/重臃肿分界线合理。

# ---- 单段硬上限（超过即点名 warning）----
paragraph_max_chars: 100            # 原400→调至100（真人最长才110字）

# ---- 1. 臃肿段（>100字）占比告警（red级） ----
long_paragraph_threshold: 100       # 臃肿段定义：>100字
long_paragraph_max_ratio: 0.03      # 占比上限：3%（真人0.1%的30倍放宽，仍严格）

# ---- 2. 轻臃肿段（>70字）占比预警（yellow级） ----
light_long_threshold: 70            # 轻臃肿段定义：>70字
light_long_max_ratio: 0.08          # 占比上限：8%（真人总体=0.9% ×9倍放宽，兜住个别章节高密度递进比较链场景）

# ---- 3. 极短句（≤10字）占比上界告警（red级，防"段太碎"） ----
ultra_short_threshold: 10           # 极短句定义：≤10字
ultra_short_max_ratio: 0.60         # 占比上限：60%（真人23.5%的2.5倍放宽）

# ---- 4. 主力区间段（11-35字）占比下界告警（red级，防分布异常） ----
main_zone_low: 11                   # 主力区间下界
main_zone_high: 35                  # 主力区间上界（真人P50-P75核心）
main_zone_min_ratio: 0.30           # 占比下限：30%（真人54.8%折半，仍要求过半段落落在这个核心区）

# ---- 5. 段长节奏变异系数 CV 区间（red级，防机械均匀/过于零碎） ----
cv_min_healthy: 0.30                # CV < 0.30 = 段段一样长的机械网格
cv_max_healthy: 1.60                # CV > 1.60 = 过于零碎（忽短忽长）
# 健康区间 0.50-1.00 = 真人金标准（CV=0.67）

# 连续“了”字上限
continuous_le_max: 5
