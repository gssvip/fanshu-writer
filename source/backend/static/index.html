    <title>蚂蚁写作</title>
    <!-- 预连接后端，加速移动端首屏 API 请求 -->
    <link rel="preconnect" href="https://fanshu-writer-backend.onrender.com" crossorigin>
    <link rel="dns-prefetch" href="https://fanshu-writer-backend.onrender.com">
    <script>
      // 强制注销所有已注册的 Service Worker（它们会缓存旧JS导致React DOM冲突）
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
          }
        });
      }
      // 版本自检：绕过 GitHub Pages / 浏览器 / PWA 缓存，部署后自动刷新
      // version.json 由 deploy.sh 每次部署生成，fetch 时带时间戳破缓存
      (function () {
        var KEY = 'fanshu-version';
        // ⚠️ 用户开了 Edge Tracking Prevention / 隐身模式 / Clear-Site-Data 清 storage 时，
        // localStorage 读写会抛 SecurityError → 直接打断 <script> 执行 → main.tsx 不加载 → 白屏。
        // 所以所有 localStorage 访问全部 try/catch，版本自检降级为「仅 fetch 拉取到新版就强制带参刷新」，
        // 不依赖本地状态也能保证不会永远拿旧缓存。
        function safeGetKey() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
        function safeSetKey(v) { try { localStorage.setItem(KEY, v); } catch (e) {} }
        function bustCache(url) { return url.replace(/([?&])_v=[^&]*(&|$)/, '$1').replace(/\?$/, '') + (url.indexOf('?') >= 0 ? '&' : '?') + '_v=' + Date.now(); }
        function reloadToNewVersion(v) {
          safeSetKey(v);
          // 用带版本参数的 URL 强制重新请求 index.html，绕过所有缓存层
          var next = bustCache(location.href.split('#')[0]);
          if (location.href !== next) {
            location.replace(next);
          } else {
            location.reload(true);
          }
        }
        var alreadyReloading = false;
        function check() {
          if (alreadyReloading) return;
          fetch('./version.json?_t=' + Date.now(), { cache: 'no-store' })
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (data) {
              if (!data || !data.v) return;
              var saved = safeGetKey();
              if (!saved) {
                // localStorage 不可用或首次访问：只要 URL 还没带版本参数，就强制刷新一次
                var hasVersionParam = /[?&]_v=/.test(location.search || '');
                safeSetKey(data.v);
                if (!hasVersionParam) {
                  alreadyReloading = true;
                  reloadToNewVersion(data.v);
                }
              } else if (saved !== data.v) {
                // 版本不一致，部署了新版，强制刷新拉取新 index.html
                alreadyReloading = true;
                reloadToNewVersion(data.v);
              }
            })
            .catch(function () { /* 静默失败，不影响使用 */ });
        }
        // 首次加载立即检查（PWA 场景不能等），之后每 60 秒轮询
        check();
        setInterval(check, 60000);
      })();
    </script>
