    <title>蚂蚁写作</title>
    <script>
      // 强制注销所有已注册的 Service Worker（避免缓存冲突）
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          for (var i = 0; i < registrations.length; i++) registrations[i].unregister();
        });
      }

      // 动态预连接：从当前 API Base 解析 origin，不再把后端域名写死在模板里
      (function () {
        try {
          var saved = localStorage.getItem('app-api-base-url');
          var envBase = (window.__APP_ENV__ && window.__APP_ENV__.VITE_API_URL) || '';
          var base = (saved && saved.trim()) || envBase || '';
          var origin = '';
          if (base) {
            try { origin = new URL(base, window.location.href).origin; } catch (e) {}
          }
          if (!origin) origin = window.location.origin;
          if (origin && origin !== window.location.origin) {
            var l1 = document.createElement('link'); l1.rel = 'preconnect'; l1.href = origin; l1.crossOrigin = 'anonymous';
            var l2 = document.createElement('link'); l2.rel = 'dns-prefetch'; l2.href = origin;
            document.head.appendChild(l1); document.head.appendChild(l2);
          }
        } catch (e) {}
      })();

      // 版本自检 + 自动刷新（绕缓存）
      (function () {
        var KEY = 'app-version';
        function safeGetKey() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
        function safeSetKey(v) { try { localStorage.setItem(KEY, v); } catch (e) {} }
        function withCacheBust(url) {
          return url.replace(/([?&])_v=[^&]*(&|$)/, '$1').replace(/\?$/, '') + (url.indexOf('?') >= 0 ? '&' : '?') + '_v=' + Date.now();
        }
        function reloadTo(v) {
          safeSetKey(v);
          var next = withCacheBust(location.href.split('#')[0]);
          if (location.href !== next) location.replace(next); else location.reload(true);
        }
        var inFlight = false;
        function check() {
          if (inFlight) return;
          inFlight = true;
          fetch('./version.json?_t=' + Date.now(), { cache: 'no-store' })
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (data) {
              if (!data || !data.v) { inFlight = false; return; }
              var saved = safeGetKey();
              if (!saved) {
                var has = /[?&]_v=/.test(location.search || '');
                safeSetKey(data.v);
                if (!has) reloadTo(data.v); else inFlight = false;
              } else if (saved !== data.v) {
                reloadTo(data.v);
              } else {
                inFlight = false;
              }
            })
            .catch(function () { inFlight = false; });
        }
        check();
        setInterval(check, 60000);
      })();
    </script>
